name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The draft release to build, such as v0.2.0; it holds the voice data's archive, and its tag exists
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download the voice data
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "opensapi4-voices-$VERSION.zip" --dir "$RUNNER_TEMP/download"
      - name: Unpack the voice data
        run: unzip -q "$RUNNER_TEMP/download/opensapi4-voices-$VERSION.zip" -d "$RUNNER_TEMP/data"
      - name: Build
        run: go run ./scripts/release -version "$VERSION" -voices "$RUNNER_TEMP/data/voices" -output "$RUNNER_TEMP/dist"
      - name: Compare the voice data's archive
        run: cmp "$RUNNER_TEMP/download/opensapi4-voices-$VERSION.zip" "$RUNNER_TEMP/dist/opensapi4-voices-$VERSION.zip"
      - name: Upload
        run: gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/dist/opensapi4-"$VERSION"-* "$RUNNER_TEMP/dist/SHA256SUMS"

  check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, archive: windows-x64.zip }
          - { runner: windows-latest, archive: windows-x86.zip }
          - { runner: windows-11-arm, archive: windows-arm64.zip }
          - { runner: ubuntu-latest, archive: linux-x64.tar.gz }
          - { runner: ubuntu-24.04-arm, archive: linux-arm64.tar.gz }
          - { runner: macos-15-intel, archive: macos-x64.tar.gz }
          - { runner: macos-latest, archive: macos-arm64.tar.gz }
    name: ${{ matrix.archive }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download
        shell: bash
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "opensapi4-$VERSION-${{ matrix.archive }}"
      - name: Check
        shell: bash
        run: go run ./scripts/check-release -archive "opensapi4-$VERSION-${{ matrix.archive }}"

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
